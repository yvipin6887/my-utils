name: Release & Publish

on:
  push:
    branches:
      - main

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      # Step 1: Create or update Release PR / Tag release
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
          token: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: Checkout code (uses the correct output boolean)
      - name: Checkout Code
        if: ${{ steps.release.outputs.releases_created }}
        uses: actions/checkout@v4

      # Step 3: Setup Node.js environment
      - name: Setup Node.js
        if: ${{ steps.release.outputs.releases_created }}
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      # Step 4: Install dependencies & run tests
      - name: Install & Test
        if: ${{ steps.release.outputs.releases_created }}
        run: |
          npm ci
          npm test

      # Step 5: Publish scoped package publicly to npm
      - name: Publish to npm
        if: ${{ steps.release.outputs.releases_created }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}